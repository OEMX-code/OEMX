<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OEMX Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* Layout: dark ink header band, tab rail, then a full-width working surface; the roster grid scrolls inside its own frame with a sticky name column. */
:root{
  --bg:#F5F3F2; --surface:#FFFFFF; --sunk:#EDE9E7; --ink:#1E1A1A; --muted:#6C6361; --line:#E0DAD8;
  --accent:#A4232B; --accent-ink:#FFFFFF; --accent-soft:#F6E3E4;
  --band:#1E1A1A; --band-ink:#F5F1F0;
  --ok:#2F7D4E; --warn:#A86A12; --crit:#B3261E; --warn-soft:#FBF0DC; --crit-soft:#F9E1DF;
  --today:#FFF4D6;
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141212; --surface:#1D1A1A; --sunk:#252121; --ink:#EEE8E7; --muted:#A79D9B; --line:#363031;
  --accent:#E25560; --accent-ink:#1A0A0B; --accent-soft:#3A1E21;
  --band:#0D0B0B; --band-ink:#EEE8E7;
  --ok:#5DBB83; --warn:#E3A84A; --crit:#F0766C; --warn-soft:#3A2D14; --crit-soft:#3E1D1A; --today:#3A3216;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141212; --surface:#1D1A1A; --sunk:#252121; --ink:#EEE8E7; --muted:#A79D9B; --line:#363031;
  --accent:#E25560; --accent-ink:#1A0A0B; --accent-soft:#3A1E21;
  --band:#0D0B0B; --band-ink:#EEE8E7;
  --ok:#5DBB83; --warn:#E3A84A; --crit:#F0766C; --warn-soft:#3A2D14; --crit-soft:#3E1D1A; --today:#3A3216;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.band{background:var(--band);color:var(--band-ink)}
header.band .wrap{display:flex;align-items:center;gap:14px;padding-block:12px;flex-wrap:wrap}
.mark{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.04em;background:var(--accent);color:#fff;padding:2px 8px;border-radius:3px;line-height:1.2}
header h1{font-family:var(--f-display);font-weight:600;font-size:22px;margin:0;letter-spacing:.02em;text-wrap:balance}
header .sync{margin-left:auto;font-size:12px;color:var(--band-ink);opacity:.7;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.dot.on{background:#4CC27E}
nav.tabs{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:12px 12px 10px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
nav.tabs a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
main{padding-block:16px 48px}
h2{font-family:var(--f-display);font-weight:700;font-size:26px;margin:0;letter-spacing:.01em;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:18px;margin:0;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:14px}
.spacer{flex:1}
button,.btn{font:inherit;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:8px 12px;cursor:pointer;min-height:38px}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.danger{color:var(--crit);border-color:var(--crit)}
button.icon{padding:8px 10px;min-width:38px}
button:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;border-radius:0;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;min-height:38px;width:100%;min-width:0}
textarea{min-height:80px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);min-width:0}
label.f>span.hint{text-transform:none;letter-spacing:0;font-weight:400}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.ok{color:var(--ok)}
.code{font-family:var(--f-display);font-weight:700;letter-spacing:.03em}
.num{font-variant-numeric:tabular-nums}

/* roster toolbar + summary */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .wk{font-family:var(--f-display);font-weight:700;font-size:20px;min-width:0}
.toolbar input[type=search]{width:auto;flex:1 1 160px}
.toolbar select{width:auto;flex:0 1 auto}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.1}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.stat.alert{border-color:var(--crit)}
.stat.alert b{color:var(--crit)}
.byco{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

/* roster grid */
.gridframe{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.ros{border-collapse:separate;border-spacing:0;font-size:13px;width:max-content;min-width:100%}
table.ros th,table.ros td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0}
table.ros thead th{position:sticky;top:0;z-index:3;background:var(--sunk);font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.04em;text-transform:uppercase;padding:6px 4px;text-align:center}
table.ros thead th.today{background:var(--today)}
table.ros th.name,table.ros td.name{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;width:168px;min-width:168px;max-width:168px}
table.ros thead th.name{z-index:4;background:var(--sunk);padding-left:10px}
td.name .who{padding:5px 8px 5px 10px;display:flex;flex-direction:column;gap:1px;cursor:pointer}
td.name .nm{font-weight:600;font-size:14px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.name .meta{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.name .flagdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--crit);margin-left:4px;vertical-align:middle}
tr.grp td{background:var(--sunk);font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.05em;text-transform:uppercase;padding:5px 10px;position:sticky;left:0}
tr.grp td .muted{font-family:var(--f-body);font-weight:500;text-transform:none;letter-spacing:0;font-size:12px}
td.cell{width:70px;min-width:70px;height:48px;vertical-align:stretch}
.span14 td.cell{width:54px;min-width:54px}
td.cell.today{box-shadow:inset 0 0 0 9999px color-mix(in srgb,var(--today) 35%,transparent)}
.cb{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;min-height:48px;border:0;border-radius:0;padding:2px;background:transparent;font:inherit;cursor:pointer;position:relative;color:inherit}
.cb .c{font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.02em;line-height:1.05;text-align:center;word-break:break-word}
.cb .h{font-size:11px;font-variant-numeric:tabular-nums;opacity:.85;line-height:1.1}
.cb .k{position:absolute;top:1px;right:3px;font-size:9px;font-weight:600;opacity:.8}
.cb.empty .c{color:var(--line);font-weight:500}
.cb.flag::after{content:"";position:absolute;left:3px;top:3px;width:7px;height:7px;border-radius:50%;background:var(--crit);box-shadow:0 0 0 1.5px #fff}
.cb:hover{filter:brightness(.95)}
td.tot{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;padding:0 8px;width:58px;min-width:58px;background:var(--surface)}
.flags{margin-top:12px}
.flags ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}

/* lists */
.tframe{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.list{border-collapse:collapse;width:100%;font-size:14px}
table.list th{text-align:left;font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
table.list td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list tr.click{cursor:pointer}
table.list tr.click:hover td{background:var(--sunk)}
table.list td.r,table.list th.r{text-align:right}
table.list input.price{width:96px;text-align:right;min-height:32px;padding:4px 8px}
.swatch{display:inline-flex;align-items:center;justify-content:center;min-width:58px;padding:3px 6px;border-radius:3px;font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.02em}
.secthead{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin:6px 0 12px}

/* FY roster */
table.ros.fy td.cell{height:30px}
table.ros.fy .cb{min-height:30px;padding:0 1px}
table.ros.fy .cb .c{font-size:11.5px;letter-spacing:0;white-space:nowrap}
table.ros.fy .cb .c.lg{font-size:9px}
.cb .c.lg{font-size:12px}
table.ros.fy td.cell{width:44px;min-width:44px}
table.ros thead tr.months th.name{z-index:5}
table.ros.fy .cb .h,table.ros.fy .cb .k{display:none}
table.ros.fy thead th{font-size:11px;padding:3px 1px}
table.ros.fy td.name .who{padding:3px 8px 3px 10px}
table.ros.fy td.name .meta{display:none}
table.ros.fy td.name .nm{font-size:13px}
table.ros thead tr.months th{top:0;text-align:left;padding-left:8px;font-size:13px;letter-spacing:.06em;background:var(--surface);border-bottom:1px solid var(--line)}
table.ros thead tr.days th{top:var(--mh,0px)}
table.ros th.wk,table.ros td.wk{border-left:2px solid var(--muted)}
.cb.pj{opacity:.62;background-image:repeating-linear-gradient(135deg,transparent 0 5px,rgba(255,255,255,.28) 5px 7px)}
.cb.pl{box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.showproj-off .cb.pj{visibility:hidden}
tr.onbline td{border-top:3px solid var(--ink);background:var(--accent-soft);font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;position:sticky;left:0;color:var(--accent)}
tr.onbline td .muted{font-family:var(--f-body);font-weight:500;letter-spacing:0;text-transform:none;font-size:12px;color:var(--muted)}
tr.onb td.name{background:var(--accent-soft)}
.stick{position:sticky;left:10px;display:inline-block}
tr.grp td,tr.onbline td{position:static!important}
.keyrow{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);margin:8px 0 0}
.keyrow .sw{display:inline-block;width:26px;height:16px;border-radius:2px;vertical-align:middle;margin-right:5px;background:#1A73A8}
.keyrow .sw.pl{box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.keyrow .sw.pj{opacity:.62;background-image:repeating-linear-gradient(135deg,transparent 0 5px,rgba(255,255,255,.35) 5px 7px)}
.empty-state{padding:28px;text-align:center;color:var(--muted)}

/* dialogs */
dialog{border:0;padding:0;border-radius:10px;background:var(--surface);color:var(--ink);width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 24px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog.wide{width:min(980px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(20,16,16,.55)}
.dh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.dh h2{font-size:22px}
.db{padding:16px;display:flex;flex-direction:column;gap:14px}
.df{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{min-height:32px;padding:4px 10px;font-family:var(--f-display);font-weight:700;letter-spacing:.03em}
.desc{font-size:13px;color:var(--muted);min-height:18px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--crit-soft);color:var(--crit);padding:8px 10px;border-radius:var(--r);font-size:14px}

/* quote lines */
.ql{overflow-x:auto}
table.qt{border-collapse:collapse;width:100%;min-width:720px;font-size:14px}
table.qt th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px;border-bottom:1px solid var(--line)}
table.qt td{padding:4px;border-bottom:1px solid var(--line);vertical-align:top}
table.qt td.amt{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;padding-top:12px;white-space:nowrap}
table.qt input,table.qt select{min-height:34px;padding:5px 7px;font-size:14px}
table.qt .rng{font-size:11px;color:var(--warn);padding:2px 2px 0}
.totals{display:grid;grid-template-columns:auto auto;gap:4px 18px;justify-content:end;font-variant-numeric:tabular-nums}
.totals b{font-size:20px;font-family:var(--f-display)}
.helper{background:var(--sunk);border-radius:var(--r);padding:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;align-items:end}

#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-size:14px;font-weight:600;z-index:50;max-width:calc(100vw - 32px)}
#toast.err{background:var(--crit);color:#fff}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:10px 12px;font-size:14px}
@media (max-width:560px){
  h2{font-size:22px}
  table.ros th.name,table.ros td.name{width:128px;min-width:128px;max-width:128px}
  td.cell{width:58px;min-width:58px}
  dialog{width:100vw;max-width:100vw;max-height:100%;height:100%;border-radius:0;margin:0}
}

/* phone landscape: roster fills the screen */
.rotate-hint{display:none}
.landonly{display:none!important}
@media (max-width:560px) and (orientation:portrait){
  .rotate-hint{display:flex;align-items:center;gap:10px;background:var(--sunk);border-radius:var(--r);padding:8px 10px;margin-bottom:10px;font-size:13px;color:var(--muted)}
  .summary{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .stat{padding:6px 8px}
  .stat b{font-size:20px}
  .stat span{font-size:10px;letter-spacing:.03em}
  .toolbar{gap:6px}
  .rotate-hint .ico{font-size:20px;line-height:1;display:inline-block;transform:rotate(90deg)}
  .rotate-hint button{margin-left:auto;min-height:30px;padding:4px 10px;font-size:13px}
}
@media (orientation:landscape) and (max-height:540px){
  header.band{display:none}
  body::before{background:var(--surface)}
  nav.tabs a{font-size:13px;padding:7px 10px 5px}
  main{padding-block:6px 0}
  .summary,.byco,.keyrow,.rotate-hint,.panel.flags{display:none!important}
  .toolbar{flex-wrap:nowrap;overflow-x:auto;gap:6px;margin-bottom:6px;scrollbar-width:none}
  .toolbar::-webkit-scrollbar{display:none}
  .toolbar > *{flex:0 0 auto}
  .toolbar button,.toolbar select,.toolbar input{min-height:32px;padding:4px 8px;font-size:13px}
  .toolbar .seg button{min-height:30px}
  .toolbar .wk{font-size:15px;white-space:nowrap}
  .toolbar input[type=search]{width:170px;flex:0 0 170px}
  .toolbar label.row{white-space:nowrap}
  .landonly{display:inline-flex!important}
  #tb2{display:none}
  #tb2.open{display:flex}
  nav.tabs a{padding:5px 10px 4px}
  td.cell{height:31px}
  .cb{min-height:31px}
  .gridframe{max-height:none;border-radius:4px}
  table.ros th.name,table.ros td.name{width:118px;min-width:118px;max-width:118px}
  table.ros td.name .meta{display:none}
  table.ros td.name .who{padding:3px 6px 3px 8px}
  table.ros td.name .nm{font-size:13px}
  td.cell{height:34px}
  .cb{min-height:34px}
  table.ros thead th{padding:3px 2px;font-size:11px}
  tr.grp td,tr.onbline td{padding-block:3px;font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.who{display:flex;align-items:center;gap:8px;margin-left:12px;font-size:13px}
.who button{min-height:0;padding:3px 8px}
form.login{max-width:380px;margin:40px auto;display:flex;flex-direction:column;gap:12px;background:var(--surface);padding:20px;border-radius:8px;border:1px solid var(--line)}
form.login h2{margin:0}
.gwrap{position:relative;width:max-content;min-width:100%}
.gridframe{outline:none;user-select:none;-webkit-user-select:none}
#selbox{position:absolute;border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);pointer-events:none;z-index:1}
#selbox .fillh{position:absolute;right:-7px;bottom:-7px;width:13px;height:13px;background:var(--accent);border:2px solid var(--surface);pointer-events:auto;cursor:crosshair;touch-action:none}
@media (pointer:coarse){#selbox .fillh{width:22px;height:22px;right:-12px;bottom:-12px;border-radius:50%}}
#fillbox{position:absolute;border:2px dashed var(--accent);pointer-events:none;z-index:1}
#selbar{position:sticky;bottom:0;z-index:6;display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;margin-top:8px;box-shadow:0 -4px 16px rgba(0,0,0,.08)}
#selbar button{min-height:32px;padding:4px 10px;font-size:13px}
.keyrow .rdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--crit);margin-right:5px;vertical-align:middle}
.picklist{max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:var(--r);padding:4px 8px;display:flex;flex-direction:column}
.picklist .pick{display:flex;gap:8px;align-items:center;padding:4px 0;font-size:14px;cursor:pointer}
.picklist .pick input{width:auto;min-height:0}
.strip{display:flex;flex-wrap:wrap;gap:2px;margin-top:6px}
.strip .sd{width:44px;height:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:3px;font-family:var(--f-display);font-size:11px;line-height:1.05}
.strip .sd.wk{margin-left:5px}
.strip .sd i{font-style:normal;font-size:10px;opacity:.85}
@media (orientation:landscape) and (max-height:540px){#selbar{position:fixed;left:8px;right:8px;bottom:6px;margin:0}}
[hidden]{display:none!important}
</style>

</head>
<body>
<header class="band">
  <div class="wrap">
    <span class="mark">OEMX</span>

(function(){

/* ---------------- helpers ---------------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));

function ink(hex){ const m=/^#?([0-9a-f]{6})$/i.exec(hex||""); if(!m)return "inherit"; const n=parseInt(m[1],16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  const L=c=>{c/=255;return c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4)}; const l=.2126*L(r)+.7152*L(g)+.0722*L(b); return l>.42?"#141010":"#FFFFFF"}
function toast(msg,err){const t=$("#toast");t.textContent=msg;t.className=err?"err":"";t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,err?6000:2600)}

const S={legend:[],L:new Map(),staff:{},assets:{},clients:{},items:{},quotes:{},weeks:{},loaded:new Set(),

function cellOf(sid,date){ const w=S.weeks[monday(date)]; const c=w&&w.cells&&w.cells[sid]&&w.cells[sid][date]; return c||null }
function companies(){ const set=new Set(S.legend.map(x=>x.co).filter(Boolean)); Object.values(S.staff).forEach(s=>s.company&&set.add(s.company)); return Array.from(set).sort() }

/* ---------------- Supabase data layer ---------------- */
const SB_URL="https://gaflnumnajejnprlpghw.supabase.co", SB_KEY="sb_publishable_2qksHRs5LQn-YXp7-Trxvg_fCyFqjys";

  active:r.status!=="left",status:CAP[r.status]||"Active",mondayStatus:r.monday_status||"",mondayId:r.monday_id||"",start:r.start_date||"",end:r.end_date||"",rosterNote:r.roster_note||"",email:r.email||"",phone:r.phone||"",homeBase:r.home_base||""});

const itemIn=r=>({code:r.code,desc:r.description,unit:r.unit,price:+r.price,min:r.min_billed==null?null:+r.min_billed,max:r.max_billed==null?null:+r.max_billed,client:r.client_prefix,source:r.source||""});
const itemOut=i=>({code:i.code,description:i.desc||i.code,unit:i.unit||"hr",price:+i.price||0,min_billed:i.min??null,max_billed:i.max??null,client_prefix:i.client||"GENERIC",source:nz(i.source)});

function sbErr(e){ const m=(e&&(e.message||e.code))||""; if(/row-level security|permission|42501/i.test(m)){const x=new Error(m);x.code="denied";return x} return e }

/* ---------------- writes ---------------- */
const chains={};
function queue(path,fn){ const p=(chains[path]||Promise.resolve()).then(fn).catch(e=>{console.error(e);toast(errMsg(e),true);throw e}); chains[path]=p.catch(()=>{}); return p }
function putLocalCell(sid,d,c){ const wk=monday(d); const w=(S.weeks[wk]??={cells:{}}); const m=(w.cells[sid]??={}); if(c)m[d]=c; else delete m[d] }
function writeCells(sid,changes){ // changes: {date: cell|null}
  const ups=[],dels=[];
  Object.entries(changes).forEach(([d,c])=>{ if(c&&(c.c||c.h||c.k||c.a)){ ups.push({staff_id:sid,day:d,code:nz(c.c),hours:nz(c.h),km:nz(c.k),asset:nz(c.a),source:c.p==="plan"?"plan":c.p==="proj"?"proj":"confirmed",updated_by:ME&&ME.id}) } else dels.push(d) });
  return queue("roster/"+sid,async()=>{
    if(ups.length) await sbq(sb.from("roster_cells").upsert(ups,{onConflict:"staff_id,day"}));
    if(dels.length) await sbq(sb.from("roster_cells").delete().eq("staff_id",sid).in("day",dels));
    Object.entries(changes).forEach(([d,c])=>putLocalCell(sid,d,c&&(c.c||c.h||c.k||c.a)?c:null)); scheduleRender();
  });
}
async function saveLegend(codes){
  const rows=codes.map((x,i)=>({code:String(x.c).trim(),description:x.d||x.c,company:nz(x.co),category:x.cat||"Other",colour:nz(x.col),sort_order:i}));
  await sbq(sb.from("legend_codes").upsert(rows,{onConflict:"code"}));
  const keep=new Set(rows.map(r=>r.code)); const gone=S.legend.map(x=>x.c).filter(c=>!keep.has(c));
  if(gone.length) await sbq(sb.from("legend_codes").delete().in("code",gone));
  S.legend=codes.slice(); S.L=new Map(S.legend.map(x=>[String(x.c).toUpperCase(),x]));
}
function saveDoc(path,data){ const [col,id]=path.split("/"); return queue(path,async()=>{
  if(col==="config"){ await saveLegend(data.codes) }
  else if(col==="staff"){ await sbq(sb.from("staff").upsert(staffOut(id,data))); S.staff[id]=data }
  else if(col==="assets"){ await sbq(sb.from("assets").upsert({id,name:data.name,type:data.type||"Ute",notes:nz(data.notes)})); S.assets[id]=data }
  else if(col==="clients"){ await sbq(sb.from("clients").upsert(clientOut(id,data))); S.clients[id]=data }
  else if(col==="items"){ await sbq(sb.from("rate_items").upsert(itemOut(data),{onConflict:"code"})); S.items[id]=data }
  else if(col==="quotes"){ throw Object.assign(new Error("quotes"),{code:"later"}) }
  scheduleRender() }) }
function patchDoc(path,data){ const [col,id]=path.split("/"); const cur=(col==="items"?S.items:col==="staff"?S.staff:col==="assets"?S.assets:S.clients)[id]||{}; return saveDoc(path,{...cur,...data}) }
function delDoc(path){ const [col,id]=path.split("/"); return queue(path,async()=>{
  if(col==="items"){ const it=S.items[id]; if(it) await sbq(sb.from("rate_items").delete().eq("code",it.code)); delete S.items[id] }
  else if(col==="assets"){ await sbq(sb.from("assets").delete().eq("id",id)); delete S.assets[id] }
  else if(col==="clients"){ await sbq(sb.from("clients").delete().eq("id",id)); delete S.clients[id] }
  else if(col==="staff"){ await sbq(sb.from("staff").delete().eq("id",id)); delete S.staff[id] }
  scheduleRender() }) }

function dh(title,sub){return `<div class="dh"><div class="stack" style="gap:2px;min-width:0"><h2>${esc(title)}</h2>${sub?`<span class="muted small">${esc(sub)}</span>`:""}</div><span class="spacer"></span><button class="icon ghost" data-close aria-label="Close">✕</button></div>`}

const FY_END="2027-06-30";
function isOnb(s){ return s.status==="Onboarding" }
function staffMatches(s){ const q=S.q.trim().toLowerCase();
  return (!S.co||(s.company||"Unassigned")===S.co) && (!q||[staffName(s),s.trade,s.company,s.site,s.ute,s.status].join(" ").toLowerCase().includes(q)) }
function visibleStaff(){
  return Object.entries(S.staff).filter(([id,s])=>s.active!==false&&!isOnb(s)).filter(([,s])=>staffMatches(s))
   .sort((a,b)=>staffName(a[1]).localeCompare(staffName(b[1])));
}
function onboardingStaff(){
  return Object.entries(S.staff).filter(([id,s])=>s.active!==false&&isOnb(s)).filter(([,s])=>!S.co&&staffMatches(s)||S.co==="Onboarding")

}
function rangeDates(){ const out=[]; if(S.span==="fy"){ let d=S.week; while(d<=FY_END){out.push(d);d=addD(d,1)} return out }
  for(let i=0;i<S.span;i++)out.push(addD(S.week,i)); return out }
function computeFlags(dates,list){
  const flags=[], rowFlag=new Set(), cellFlag=new Set();
  dates.forEach(d=>{ const use={};
    list.forEach(([sid,s])=>{ const c=cellOf(sid,d); const code=c&&c.c; if(!isWorking(code))return; const an=(c&&c.a)||s.ute; if(!an||an==="NO")return; (use[an.toUpperCase()]??=[]).push(sid) });
    Object.entries(use).forEach(([a,ids])=>{ if(ids.length>1){ const proj=ids.every(i=>cellOf(i,d)?.p==="proj"); flags.push({t:proj?"warn":"crit",d,msg:`${a} booked for ${ids.map(i=>staffName(S.staff[i])).join(" and ")}${proj?" (projected)":""}`,sid:ids[0]}); ids.forEach(i=>{rowFlag.add(i);cellFlag.add(i+"|"+d)}) } });
  });
  list.forEach(([sid,s])=>{ let any=false;
    dates.forEach(d=>{ const c=cellOf(sid,d); if(!c)return; if(c.c||c.h)any=true; const code=(c.c||"").toUpperCase();
      if(code&&!lg(code)){flags.push({t:"warn",d,sid,msg:`${staffName(s)}: “${c.c}” isn't in the legend`});cellFlag.add(sid+"|"+d);rowFlag.add(sid)}
      if(ATTN.has(code)||ATTN.has(String(c.k||"").toUpperCase())||ATTN.has(String(c.h||"").toUpperCase())){flags.push({t:"warn",d,sid,msg:`${staffName(s)}: ${code||c.k||c.h} needs follow-up`});cellFlag.add(sid+"|"+d);rowFlag.add(sid)}
      if(hrs(c.h)>0&&code&&!isWorking(code)&&!lg(code)?.cat?.includes("Travel")){flags.push({t:"warn",d,sid,msg:`${staffName(s)}: ${c.h} hrs entered on a ${code} day`});cellFlag.add(sid+"|"+d);rowFlag.add(sid)}
    });
    if(!any&&!isOnb(s)){flags.push({t:"warn",d:dates[0],sid,msg:`${staffName(s)} has nothing rostered in this period${s.rosterNote?" — "+s.rosterNote:""}`});rowFlag.add(sid)}
  });
  flags.sort((a,b)=>(a.t===b.t?0:a.t==="crit"?-1:1)||a.d.localeCompare(b.d));
  return {flags,rowFlag,cellFlag};
}
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function cellHtml(sid,s,d,cellFlag){
  const c=cellOf(sid,d)||{}; const e=lg(c.c);

  const cls=(c.c||c.h?"":"empty")+(cellFlag.has(sid+"|"+d)?" flag":"")+(c.p==="proj"?" pj":c.p==="plan"?" pl":"");
  const tip=[c.c&&(c.c+(e?" — "+e.d+(e.co&&e.co!=="OEMX"?" ("+e.co+")":""):" — not in legend")),c.p==="proj"?"Projected from swing pattern":c.p==="plan"?"Planned on archived roster":"",c.h&&("Hours: "+c.h),c.k&&("Km / note: "+c.k),c.a&&("Asset: "+c.a)].filter(Boolean).join("\n");
  return `<td class="cell${d===TODAY?" today":""}${mon}"><button class="cb ${cls}" data-cell="${sid}|${d}" style="background:${bg};color:${fg}" title="${esc(staffName(s)+" · "+DOW[(pd(d).getDay()+6)%7]+" "+fmtD(d)+"\n"+(tip||"Empty — tap to add"))}"><span class="c${(c.c||"").length>4?" lg":""}">${esc(c.c||(S.span==="fy"?"":"+"))}</span>${c.h?`<span class="h">${esc(c.h)}</span>`:""}${c.k?`<span class="k">${esc(String(c.k).slice(0,6))}</span>`:""}</button></td>`;
}

  // month header

function gridKey(e){

const FORMATS={
  "21":{label:"2:1 — 14 on / 7 off · week DS, week NS",on:14,off:7,shift:"split"},
  "86":{label:"8:6 — 8 on / 6 off · NS swing, R&R, DS swing",on:8,off:6,shift:"altN"},
  "22":{label:"2:2 — 14 on / 14 off · week DS, week NS",on:14,off:14,shift:"split"},
  "77":{label:"7:7 — 7 on / 7 off",on:7,off:7,shift:"altD"},
  "custom":{label:"Custom days on / off"},
  "adhoc":{label:"Ad hoc date range (no R&R)"},
  "repeat":{label:"Repeat existing days (roll a block forward)"}};
const SHIFTS={split:"First half DS, second half NS",altD:"Alternate swings: DS first",altN:"Alternate swings: NS first",D:"Day shift only",N:"Night shift only",none:"No shift marker"};
function autoSite(sid){ const s=S.staff[sid]; let last=null; const from=addD(TODAY,-60);
  for(let d=from; d<=addD(TODAY,60); d=addD(d,1)){ const c=cellOf(sid,d); if(c&&isOnSite(c.c))last=c.c; if(d>=TODAY&&last)break }
  if(last)return last; const site=S.legend.find(x=>x.cat==="Client site"&&s.site&&x.d.toUpperCase()===String(s.site).replace(/\s*\(.*\)/,"").toUpperCase()); return site?site.c:"" }
function shiftOf(mode,i,on,k){ if(mode==="split")return i<on/2?"D":"N"; if(mode==="altD")return k%2?"N":"D"; if(mode==="altN")return k%2?"D":"N"; if(mode==="D"||mode==="N")return mode; return "" }
function buildPlan(sid,o){
  const out={}; const site=(o.site||autoSite(sid)||"").toUpperCase(); if(!o.start||!o.until||o.until<o.start)return out;
  if(o.fmt==="repeat"){ const src=[]; for(let d=o.rf; d<=o.rt; d=addD(d,1))src.push(cleanCell(cellOf(sid,d))); if(!src.length)return out;
    let t=0; for(let d=o.start; d<=o.until; d=addD(d,1),t++){ const v=src[t%src.length]; if(v)out[d]={...v} } return out }
  if(!site)return out;
  if(o.fmt==="adhoc"){ let i=0; const n=(pd(o.until)-pd(o.start))/864e5+1; for(let d=o.start; d<=o.until; d=addD(d,1),i++){ const sh=shiftOf(o.shift,i,n,0); out[d]=sh?{c:site,h:sh}:{c:site} } return out }
  const on=o.on, off=o.off, cyc=on+off; if(!on)return out; let t=0;
  for(let d=o.start; d<=o.until; d=addD(d,1),t++){ const k=Math.floor(t/cyc), i=t%cyc;
    if(i>=on){ out[d]={c:"R"}; continue }
    if(o.travel&&i===0){ out[d]={c:o.tin}; continue }
    if(o.travel&&i===on-1&&on>1){ out[d]={c:o.tout}; continue }
    const sh=shiftOf(o.shift,i,on,k); out[d]=sh?{c:site,h:sh}:{c:site} }
  return out;
}

function quotePdf(q){

  y=Math.max(ly,ry)+14;

    y+=hgt; d.setDrawColor(224,218,216); d.line(M,y-9,W-M,y-9) });
  if(y>700){d.addPage();y=M}
  y+=8; d.setFontSize(10); [["Subtotal (ex GST)",money(t.sub)],["GST 10%",money(t.gst)]].forEach(r=>{d.text(r[0],W-M-150,y);d.text(r[1],W-M,y,{align:"right"});y+=15});

function parseCsv(text){ const rows=[]; let r=[],v="",q=false; for(let i=0;i<text.length;i++){const ch=text[i];
  if(q){ if(ch==='"'){ if(text[i+1]==='"'){v+='"';i++} else q=false } else v+=ch }
  else if(ch==='"')q=true; else if(ch===","){r.push(v);v=""} else if(ch==="\n"||ch==="\r"){ if(ch==="\r"&&text[i+1]==="\n")i++; r.push(v);rows.push(r);r=[];v="" } else v+=ch }
  if(v||r.length){r.push(v);rows.push(r)} return rows.filter(x=>x.some(c=>c.trim())) }
async function importItems(file){
  const rows=parseCsv(await file.text()); if(rows.length<2){toast("That file has no rows.",true);return}
  const H=rows[0].map(h=>h.replace(/^\*/,"").replace(/\s+/g,"").toLowerCase()); const ix=n=>H.indexOf(n);
  const iCode=ix("itemcode"), iName=ix("itemname"), iDesc=ix("salesdescription"), iPrice=ix("salesunitprice");
  if(iCode<0||iPrice<0){toast("Couldn't find ItemCode and SalesUnitPrice columns. Export Products and services from Xero and try again.",true);return}
  const prefixes=Object.values(S.clients).map(c=>(c.prefix||"").toUpperCase()).filter(Boolean).sort((a,b)=>b.length-a.length);
  let n=0, skipped=0; toast("Importing items…");
  for(const r of rows.slice(1)){ const code=(r[iCode]||"").trim(); const price=parseFloat(String(r[iPrice]||"").replace(/[$,]/g,"")); if(!code||isNaN(price)){skipped++;continue}
    const up=code.toUpperCase(); const px=prefixes.find(p=>up.startsWith(p+" "))||"GENERIC";
    const unit=/\bKM\b/.test(up)?"km":/\bVH\b|DAY/.test(up)?"day":/GEN\b/.test(up)?"shift":/CONS|MISC/.test(up)?"ea":"hr";
    const id=slug(code); const ex=S.items[id]||{};
    try{ await saveDoc("items/"+id,{code,desc:(iDesc>=0&&r[iDesc]?r[iDesc]:(iName>=0?r[iName]:code)).trim(),unit:ex.unit||unit,price,min:ex.min??price,max:ex.max??price,client:ex.client||px,source:"Xero items export"}); n++ }catch(_){ break } }
  toast(`Imported ${n} items${skipped?`, skipped ${skipped} without a price`:""}`);
}

const ACCOM={AC:"Booked",ACC:"Not booked",JAC:"Jared accom"};
const PREP=new Set(["IND","MED","MED?","PEM","F2F","DAS","VOC","T","TAFE","START"]);
function swingsFor(sid,s,from,to){
  const out=[]; let cur=null; const end=addD(to,21);
  for(let d=addD(from,-21); d<=end; d=addD(d,1)){
    const c=cellOf(sid,d); const code=c&&c.c; const up=String(code||"").toUpperCase(); const e=lg(code);
    const work=isWorking(code)&&!PREP.has(up)&&!(e&&e.cat==="Pre-employment / admin");
    if(work){ if(!cur)cur={sid,start:d,days:[]}; cur.days.push([d,c]); cur.end=d }
    else if(cur){ out.push(cur); cur=null }
  }
  if(cur)out.push(cur);
  return out.filter(w=>w.end>=from&&w.start<=to).map(w=>{
    const codes=w.days.map(([,c])=>String(c.c||"").toUpperCase());
    const sites=[...new Set(codes.filter(x=>isOnSite(x)))];
    const firstE=lg(codes[0]), lastE=lg(codes[codes.length-1]);
    const tin=firstE&&firstE.cat==="Travel"?codes[0]:"", tout=lastE&&lastE.cat==="Travel"?codes[codes.length-1]:"";
    const flags=new Set(); w.days.forEach(([,c])=>[c.c,c.h,c.k].forEach(v=>String(v||"").toUpperCase().split(/[\s+\/]+/).forEach(t=>{if(ACCOM[t])flags.add(t)})));
    const prep=new Set(); for(let d=addD(w.start,-14); d<=w.end; d=addD(d,1)){ const c=cellOf(sid,d); [c&&c.c,c&&c.h,c&&c.k].forEach(v=>String(v||"").toUpperCase().split(/[\s+\/]+/).forEach(t=>{if(PREP.has(t))prep.add(t)})) }
    const drive=[tin,tout].some(t=>/^D(I|O)/.test(t)); const asset=(w.days.find(([,c])=>c.a)||[])[1]?.a||"";
    const src=new Set(w.days.map(([,c])=>c.p||"set"));
    const co=sites.map(x=>lg(x)?.co).filter(Boolean)[0]||s.company||"";
    const attn=w.days.some(([,c])=>ATTN.has(String(c.c||"").toUpperCase())||ATTN.has(String(c.h||"").toUpperCase())||ATTN.has(String(c.k||"").toUpperCase()));
    return {...w,sites,co,tin,tout,accom:[...flags],prep:[...prep],ute:asset||(drive?(s.ute&&s.ute!=="NO"?s.ute:""):""),drive,tentative:!src.has("set"),planned:src.has("plan"),attn};
  });
}

   <td>${r.co?chip(r.co):""} ${r.sites.map(sw).join(" ")||'<span class="muted">—</span>'}</td>
   <td class="num">${fmtD(r.start)}</td><td class="num">${fmtD(r.end)}</td>

   <td>${esc(r.ute)||'<span class="muted">—</span>'}</td>
   <td>${r.prep.map(sw).join(" ")||'<span class="muted">—</span>'}</td>
   <td>${r.tentative?chip(r.planned?"Planned":"Projected"):chip("Rostered","ok")}${r.attn?" "+chip("Check","warn"):""}</td></tr>`).join("")||`<tr><td colspan="9"><div class="empty-state">No swings in this period.</div></td></tr>`}
  </tbody></table></div>
  <p class="small muted">Built from the roster. Accommodation comes from AC / ACC / JAC entries; the ute shows when the swing starts or ends with a drive code. Tap a row to open that day on the roster.</p>`;
  $("#mq").oninput=e=>{S.mobQ=e.target.value;render()}; $("#mco").onchange=e=>{S.mobCo=e.target.value;render()}; $("#mwk").onchange=e=>{S.mobWeeks=+e.target.value;render()};

}

function setSync(on,text){ $("#syncdot").className="dot"+(on?" on":""); $("#synctext").textContent=text }
async function saveFile(filename,data){
  try{ const blob=data instanceof Blob?data:new Blob([data],{type:/\.csv$/i.test(filename)?"text/csv":/\.pdf$/i.test(filename)?"application/pdf":"application/octet-stream"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000) }
  catch(e){ toast("The file wasn't saved. Try again.",true) }
}

  S.assets=Object.fromEntries(assets.map(r=>[r.id,{name:r.name,type:r.type,notes:r.notes||""}]));
  S.clients=Object.fromEntries(clients.map(r=>[r.id,clientIn(r)]));

  const RN={manager:"Manager",coordinator:"Coordinator",mobilisation:"Mobilisation Officer",accounts:"Accounts"};
  $("#who").hidden=false; $("#whoname").textContent=ME.name+" · "+(RN[ME.role]||ME.role); $("#tabs").parentElement.hidden=false;
  const v=location.hash.slice(1); setView(VIEWS.includes(v)?v:"roster");
  db=true; await loadAll().catch(e=>{console.error(e);setSync(false,"Couldn't load");toast("Couldn't load the data. Refresh to try again.",true)});
}
async function boot(){
  $("#so").onclick=()=>sb.auth.signOut();
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&ME&&Date.now()-(S.lastLoad||0)>60000&&!dlg.open)loadAll().catch(()=>{}) });
  let started=false;
  sb.auth.onAuthStateChange((ev,session)=>{
    if(session&&!started){ started=true; setTimeout(()=>startApp(session),0) }
    if(!session){ started=false; ME=null; db=null; showLogin() } });
}
boot();

})();
</script>
